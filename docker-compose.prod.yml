services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://be-brevet.taxcenterug.com/api/v1}
        NEXT_PUBLIC_API_URL_DEV: ${NEXT_PUBLIC_API_URL_DEV:-http://localhost:8083/api/v1}
        NEXT_PUBLIC_API_URL_PROD: ${NEXT_PUBLIC_API_URL_PROD:-https://be-brevet.taxcenterug.com/api/v1}
        NEXT_PUBLIC_ASSET_URL: ${NEXT_PUBLIC_ASSET_URL:-https://be-brevet.taxcenterug.com}
        NEXT_PUBLIC_ASSET_URL_DEV: ${NEXT_PUBLIC_ASSET_URL_DEV:-http://localhost:8083}
        NEXT_PUBLIC_ASSET_URL_PROD: ${NEXT_PUBLIC_ASSET_URL_PROD:-https://be-brevet.taxcenterug.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://brevet.taxcenterug.com}
    image: ${DOCKER_IMAGE:-zidanindratama/frontend-brevet:latest}
    container_name: frontend-brevet-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
